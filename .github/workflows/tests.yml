name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        # The suite uses a fake graph; no FalkorDB credentials needed.
        run: PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_graph_agent.py
