# Render Blueprint for Wry — WeMakeDevs Graph Hacks, Track 1.
#
# Deploy: Render dashboard → New → Blueprint → connect this repo → Apply.
# When prompted, fill in FALKORDB_HOST and FALKORDB_PASSWORD from your .env
# (they are marked `sync: false` below so their values are never committed).
#
# The app is a single FastAPI service (UI + API, same origin). It talks to
# FalkorDB Cloud over the network, so there is nothing else to provision.
# Health check is GET /api/status — light, no graph query.
services:
  - type: web
    name: wry-change-impact
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_USERNAME
        value: default
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "true"
      - key: FALKORDB_GRAPH
        value: wry_change_impact
      - key: WRY_ALLOW_REPOSITORY_METADATA_UPLOAD
        value: "false"
      - key: LLM_TOOL_SELECTION
        value: "false"
